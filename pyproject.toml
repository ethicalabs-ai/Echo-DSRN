[project]
name = "echo-dsrn"
version = "0.1.3rc3"
description = "Echo-DSRN: Surprise-Gated Dual-State Recurrent Architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.1",
    "datasets>=2.14.0",
    "numpy>=1.21.0",
    "peft>=0.18.0",
    "tqdm>=4.60.0",
    "transformers==5.2.0",
    "trl>=0.25.1",
    "wandb>=0.16.0",
]

[project.optional-dependencies]
# CPU-only build — used in CI (uv sync --extra cpu)
cpu = [
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "torchaudio>=2.10.0",
]
# ROCm build — used locally (uv sync --extra rocm)
rocm = [
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "torchaudio>=2.10.0",
    "bitsandbytes>=0.46.1",
    "pytorch-triton-rocm",
    "triton-rocm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["echo_dsrn", "echo_hybrid"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# ROCm extra routes torch packages to the ROCm wheel index
torch = [
    { index = "pytorch-rocm", extra = "rocm" },
    { index = "pytorch-cpu",  extra = "cpu"  },
]
torchvision = [
    { index = "pytorch-rocm", extra = "rocm" },
    { index = "pytorch-cpu",  extra = "cpu"  },
]
torchaudio = [
    { index = "pytorch-rocm", extra = "rocm" },
    { index = "pytorch-cpu",  extra = "cpu"  },
]
pytorch-triton-rocm = { index = "pytorch-rocm" }
triton-rocm         = { index = "pytorch-rocm" }
triton              = { index = "pytorch-rocm" }
# vLLM ROCm pre-built wheels — install separately:
# pip install vllm --extra-index-url https://download.pytorch.org/whl/rocm7.2

[tool.uv]
prerelease = "allow"
conflicts = [
    [
        { extra = "cpu" },
        { extra = "rocm" },
    ],
]

# [tool.uv.extra-build-dependencies]
# flash-attn = ["torch", "packaging", "ninja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=echo_dsrn --cov=echo_hybrid --cov-report=term-missing --cov-report=html:htmlcov"
filterwarnings = [
    # huggingface_hub xet download API churn — third-party, not actionable by us
    "ignore:hf_xet.download_files\\(\\) is deprecated:DeprecationWarning",
    # torch.jit.script_method used internally by GRUCell — not actionable by us
    "ignore:`torch.jit.script_method` is deprecated:DeprecationWarning",
]
markers = [
    "integration: downloads Hub weights — requires network access (deselect with '-m not integration')",
    "local_model: requires locally merged model files under models/ — not available in CI",
]

[tool.coverage.run]
source = ["echo_dsrn", "echo_hybrid"]
omit = ["*/triton_scan.py"]  # Triton kernels are not importable on CPU-only CI

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
skip-string-normalization = true
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.cache
  | \.env
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
