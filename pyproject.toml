[project]
name = "echo-dsrn"
version = "0.1.3"
description = "Echo-DSRN: Surprise-Gated Dual-State Recurrent Architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.1",
    "datasets>=2.14.0",
    "numpy>=1.21.0",
    "peft>=0.18.0",
    "tqdm>=4.60.0",
    "transformers==5.2.0",
    "trl>=0.25.1",
    "wandb>=0.16.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "torchaudio>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["echo_dsrn", "echo_hybrid"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
rocm = [
    "bitsandbytes>=0.46.1",
    "pytorch-triton-rocm",
    "triton-rocm",
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.1/"
explicit = true

[tool.uv.sources]
pytorch-triton-rocm = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
triton-rocm = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
torch = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
triton = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
# vLLM ROCm pre-built wheels — pip install vllm --index-url https://download.pytorch.org/whl/rocm7.1
# uv cannot pull these automatically because vllm is not on that index;
# install separately: pip install vllm --extra-index-url https://download.pytorch.org/whl/rocm7.1

[tool.uv]
prerelease = "allow"

# [tool.uv.extra-build-dependencies]
# flash-attn = ["torch", "packaging", "ninja"]

[tool.black]
line-length = 100
skip-string-normalization = true
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.cache
  | \.env
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
