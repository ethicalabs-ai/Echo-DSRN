# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml
# Serve Echo-DSRN and Echo-Hybrid simultaneously via vLLM (ROCm / AMD GPU)
# Base image: vllm/vllm-openai-rocm:latest  (formerly rocm/vllm-openai)
#
# Prerequisites
# ─────────────
#   • Docker + docker-compose v2
#   • ROCm runtime installed on the host
#   • (Optional) HF_TOKEN in your shell or a .env file for gated models
#
# Quick start
# ───────────
#   docker compose build
#   docker compose up
#
#
#   # Echo-Hybrid OpenAI-compatible API:
#   curl http://localhost:8001/v1/completions \
#     -H "Content-Type: application/json" \
#     -d '{"model":"echo-hybrid","prompt":"Hello, world","max_tokens":32}'
#
#   # Echo-Intent classification API:
#   curl http://localhost:8002/classify \
#     -H "Content-Type: application/json" \
#     -d '{"model":"echo-intent","input":["Is it going to rain today?"]}'
#
# Serving local checkpoints
# ─────────────────────────
#   Set MODEL_PATH_DSRN / MODEL_PATH_HYBRID to the host-side checkpoint
#   directories and uncomment the volume + model path overrides below.
#
# Environment overrides  (.env file or shell exports)
# ────────────────────────────────────────────────────
#   HF_TOKEN              HuggingFace token (needed for private/gated models)
#   ROCR_VISIBLE_DEVICES  Comma-separated GPU indices (default: all)
#   HYBRID_GPU            GPU index for Echo-Hybrid (default: 0; set to 1 for
#                         multi-GPU setups)
#   INTENT_GPU            GPU index for Echo-Intent (default: 0)
#   HYBRID_DTYPE          bfloat16 | float16 | auto   (default: bfloat16)
#   INTENT_DTYPE          bfloat16 | float16 | auto   (default: bfloat16)
#   HYBRID_GPU_MEM        Same for Hybrid service              (default: 0.25)
#   INTENT_GPU_MEM        Fraction of GPU memory vLLM may use (default: 0.15)
#   HYBRID_MAX_LEN        Max context length for Echo-Hybrid  (default: 8192, Qwen2.5 backbone supports 32k)
#   INTENT_MAX_LEN        Max context length for Echo-Intent  (default: 2048)
# ─────────────────────────────────────────────────────────────────────────────

x-rocm-common: &rocm-common
  build:
    context: .
    dockerfile: Dockerfile
  # ROCm device access — exposes all GPUs; restrict via ROCR_VISIBLE_DEVICES
  devices:
    - /dev/kfd
    - /dev/dri
  group_add:
    - video
    - render
  # Shared memory required by ROCm's HSA runtime
  ipc: host
  security_opt:
    - seccomp:unconfined
  # Cache HF model weights on the host so they survive container restarts
  volumes:
    - hf-cache:/root/.cache/huggingface
    # Uncomment to serve local checkpoints:
    # - /path/to/local/echo-dsrn:/models/echo-dsrn:ro
    # - /path/to/local/echo-hybrid:/models/echo-hybrid:ro
  environment:
    - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    - HF_HUB_ENABLE_HF_TRANSFER=1
  restart: unless-stopped

services:
  # ── Echo-Hybrid 0.7B ───────────────────────────────────────────────────────
  echo-hybrid:
    <<: *rocm-common
    container_name: echo-hybrid
    ports:
      - "8001:8001"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - ROCR_VISIBLE_DEVICES=${HYBRID_GPU:-0}
    command:
      - --model
      - ${HYBRID_MODEL:-mrs83/Kurtis-EON1-Hybrid-0.7B-v0.1.1}
      - --served-model-name
      - echo-hybrid
      - --trust-remote-code
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
      - --dtype
      - ${HYBRID_DTYPE:-bfloat16}
      - --gpu-memory-utilization
      - ${HYBRID_GPU_MEM:-0.25}
      - --max-model-len
      - "${HYBRID_MAX_LEN:-8192}"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      # Required for recurrent DSRN state: CUDA graph capture freezes
      # HybridEchoCache.dsrn_states as a constant, wiping recurrent state
      # each decode step and causing hallucinations (same fix as Jamba/Mamba).
      - --enforce-eager
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Echo-Intent (Intent Classifier) ──────────────────────────────
  echo-intent:
    <<: *rocm-common
    container_name: echo-intent
    ports:
      - "8002:8002"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - .:/workspace
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - ROCR_VISIBLE_DEVICES=${INTENT_GPU:-0}
    command:
      - --model
      - ${INTENT_MODEL:-ethicalabs/Echo-DSRN-v0.1.3-Intent-CLF}
      - --served-model-name
      - echo-intent
      - --runner
      - pooling
      - --convert
      - classify
      - --trust-remote-code
      - --host
      - "0.0.0.0"
      - --port
      - "8002"
      - --dtype
      - ${INTENT_DTYPE:-bfloat16}
      - --pooler-config
      - '{"pooling_type": "LAST"}'
      - --gpu-memory-utilization
      - ${INTENT_GPU_MEM:-0.15}
      - --max-model-len
      - "${INTENT_MAX_LEN:-2048}"
      # Required for recurrent DSRN state: CUDA graph capture freezes
      # HybridEchoCache.dsrn_states as a constant, wiping recurrent state
      # each decode step and causing hallucinations.
      - --enforce-eager
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Echo-Embed (sentence embeddings via vLLM pooling runner) ──────────
  echo-embed:
    <<: *rocm-common
    container_name: echo-embed
    ports:
      - "8003:8003"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - ROCR_VISIBLE_DEVICES=${EMBED_GPU:-1}
    command:
      - --model
      - ${EMBED_MODEL:-ethicalabs/Echo-DSRN-v0.1.3-Embed-Exp}
      - --served-model-name
      - echo-embed
      - --runner
      - pooling
      - --convert
      - embed
      - --trust-remote-code
      - --host
      - "0.0.0.0"
      - --port
      - "8003"
      - --dtype
      - ${EMBED_DTYPE:-bfloat16}
      - --gpu-memory-utilization
      - ${EMBED_GPU_MEM:-0.3}
      - --max-model-len
      - "${EMBED_MAX_LEN:-2048}"
      # Recurrent DSRN state: CUDA graph capture freezes HybridEchoCache
      # dsrn_states, wiping recurrent state each decode step.
      - --enforce-eager
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8003/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  hf-cache:
    driver: local
