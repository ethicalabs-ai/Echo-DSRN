          - chat_template.jinja
          - modeling_echo.py
          - configuration_echo.py
          - triton_scan.py
          - utils.py
          - __init__.py

  # ── DSRN Embedding Classifier ─────────────────────────────────────────
  # The embed-based intent classifier is a plain transformers repo
  # (architectures EchoForSequenceClassification) and syncs like any other
  # classifier. The sentence-transformers embedding repos (Embed-Exp,
  # Embed-Intent) are NOT here — they are owned by the embedding_training
  # pipeline in Echo-DSRN-Workspace (ST-format export, synced separately).
  ethicalabs/Echo-DSRN-v0.1.4-Embed-Intent-CLF:
    auto_class: AutoModelForSequenceClassification
    sources:
      - dir: echo_dsrn
        files:
          - chat_template.jinja
          - modeling_echo.py
          - configuration_echo.py
          - triton_scan.py
          - utils.py
      - dir: echo_embedding
        files:
          - modeling_embedding.py

  # ── Echo-Hybrid Models ──────────────────────────────────────────────────
  # Hybrid models need both echo_hybrid/ modules AND echo_dsrn/ modules
  # because dsrn_memory_block.py imports from modeling_echo.py.
  #
  # IMPORTANT: Due to HF dynamic-module-loader caching bugs, hybrid
  # checkpoints need pre-caching of all transitive dependencies before
  # model load.  The sync script handles this automatically.
  mrs83/Kurtis-EON1-Hybrid-0.7B-v0.1.1:
    auto_class: AutoModelForCausalLM
    sources:
      - dir: echo_hybrid
        files:
          - modeling_hybrid.py
          - configuration_hybrid.py
          - dsrn_memory_block.py
      - dir: echo_dsrn
        files:
          - modeling_echo.py
          - configuration_echo.py
          - triton_scan.py
          - utils.py
          - __init__.py

  mrs83/Kurtis-EON1-Hybrid-2B-v0.1.2:
