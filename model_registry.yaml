# Echo-DSRN Model Registry
# ─────────────────────────────────────────────────────────────────────────────
# Canonical registry of all published HF checkpoints that use
# trust_remote_code=True with custom Python modules.
#
# Adding a model to this registry is all you need to keep its HF modules
# in sync with the local source — run `uv run --extra rocm python scripts/sync_hf_modules.py`
# and it will download, sync, test, and upload.
#
# Key rules:
#   • auto_map in config.json is NEVER modified — it encodes the model class.
#   • SentenceTransformer / embedding models are handled separately.
#   • TYPE_CHECKING blocks are auto-patched for HF dynamic module loader.
#   • import prefixes (echo_dsrn.* → .) are auto-patched.
# ─────────────────────────────────────────────────────────────────────────────

models:
  # ── DSRN Base Models ────────────────────────────────────────────────────
  ethicalabs/Echo-DSRN-114M-v0.1.2:
    auto_class: AutoModelForCausalLM
    sources:
      - dir: echo_dsrn
        files:
          - chat_template.jinja
          - modeling_echo.py
          - configuration_echo.py
          - triton_scan.py
          - utils.py
          - __init__.py

  # ── DSRN Classifiers ────────────────────────────────────────────────────
  ethicalabs/Echo-SmolTools-114M-Intent-CLF-Gen:
